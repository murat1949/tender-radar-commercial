name: Telegram Commercial TEST

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client ID для безопасной тестовой отправки"
        required: true
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mark test start time
        run: echo "RUN_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Send Telegram digest only to selected client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUN_STARTED_AT: ${{ env.RUN_STARTED_AT }}
          TELEGRAM_CLIENT_ID: ${{ inputs.client_id }}
        run: python telegram_notify_commercial.py
