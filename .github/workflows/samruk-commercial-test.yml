name: Samruk Commercial TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samruk-commercial-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Selenium
        run: pip install selenium

      - name: Run Samruk Commercial TEST V2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAMRUK_MAX_PAGES: "1"
          SAMRUK_DETAIL_LIMIT: "3"
        run: python -u auto_collect_samruk_commercial_TEST_V2.py
